services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres

    environment:
      POSTGRES_DB: ecommerce_backend
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data 

    restart: unless-stopped

volumes:
  postgres_data: